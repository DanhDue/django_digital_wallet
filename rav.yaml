scripts:
    install:
      - pip install -r requirements.txt
    server:
      - cd src && uvicorn zeno.asgi:application --reload --host 127.0.0.1 --port 8888
    makemigrations:
      - cd src && python3 manage.py makemigrations
    migrate:
      - cd src && python3 manage.py migrate
    shell:
      - cd src && python3 manage.py shell
    curl_register: | 
      curl -X POST -H "Content-Type: application/json" \
        -d '{"username":"danhdue","password":"Abca@123"}' \
        http://127.0.0.1:8888/api/users/register
    curl_auth: | 
      curl -X POST -H "Content-Type: application/json" \
        -d '{"username":"danhdue","password":"Abca@123"}' \
        http://127.0.0.1:8888/api/users/login
    curl_protect: | 
      curl -X GET -H "Authorization: Bearer <curl_auth_access_token>" \
        http://127.0.0.1:8888/api/users/me