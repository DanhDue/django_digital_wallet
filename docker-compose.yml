version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: zeno_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeno_db}
      POSTGRES_USER: ${POSTGRES_USER:-zeno_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeno_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeno_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zeno_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-build-time-secret-key-not-for-production}
        - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
    container_name: zeno_web
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        uvicorn zeno.asgi:application --host 0.0.0.0 --port $${PORT:-8888} --reload
      "
    working_dir: /code
    volumes:
      - ./src:/code
      - static_volume:/code/staticfiles
      - media_volume:/code/media
    ports:
      - "${PORT:-8888}:8888"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use PostgreSQL in docker-compose
      # (ignores sqlite:///db.sqlite3 from .env file)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zeno_user}:${POSTGRES_PASSWORD:-zeno_password}@db:5432/${POSTGRES_DB:-zeno_db}
      # All other variables (DJANGO_SECRET_KEY, DJANGO_DEBUG, ENV_ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS)
      # are loaded automatically from .env file via env_file directive above
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zeno_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  zeno_network:
    driver: bridge
